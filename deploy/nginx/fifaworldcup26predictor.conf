# nginx site for fifaworldcup26predictor.ahbab.dev
# Reverse-proxies the predictor (uvicorn/Docker on 127.0.0.1:8090) and terminates TLS.
# This is a SEPARATE server block from the portfolio on ahbab.dev — they don't interfere.
#
# Install:
#   sudo cp deploy/nginx/fifaworldcup26predictor.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/fifaworldcup26predictor.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fifaworldcup26predictor.ahbab.dev   # provisions the cert + 443 block

# --- HTTP: redirect everything to HTTPS (certbot also manages this) ---
server {
    listen 80;
    listen [::]:80;
    server_name fifaworldcup26predictor.ahbab.dev;

    # Allow ACME http-01 challenges for certificate issuance/renewal.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: serve the app ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fifaworldcup26predictor.ahbab.dev;

    # Certs provisioned by certbot (Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/fifaworldcup26predictor.ahbab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fifaworldcup26predictor.ahbab.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    client_max_body_size 1m;

    # Long-cache the content-hashed build assets.
    location /assets/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else (SPA + /api + sitemap.xml + robots.txt) -> the app.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
