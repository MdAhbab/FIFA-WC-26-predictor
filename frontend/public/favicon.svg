      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="foil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6BFF"/>
      <stop offset="50%" stop-color="#E5247A"/>
      <stop offset="100%" stop-color="#FFC23C"/>
